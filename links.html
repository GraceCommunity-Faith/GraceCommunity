<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grace Community Church &mdash; Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;0,600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pine:      #2A5C3F;
      --pine-dk:   #1C3D2A;
      --pine-lt:   #3A7A56;
      --crimson:   #8B1A1A;
      --crimson-lt:#A52020;
      --cream:     #F5EAD7;
      --sand:      #C4A580;
      --sand-lt:   #E8D5B0;
      --off-white: #FAF5EE;
      --text:      #3D2E1E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: var(--off-white);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
    }

    .page {
      flex: 1;
      width: 100%;
      max-width: 640px;
      padding: 3.5rem 1.25rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Logo card ── */
    .logo-card {
      background: var(--off-white);
      border-radius: 24px;
      padding: 1.5rem 1.75rem 1.25rem;
      box-shadow: 0 8px 28px rgba(42,92,63,0.18);
      margin-bottom: 2.25rem;
    }
    .logo-card img {
      width: 180px;
      max-width: 60vw;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* ── Heading & tagline ── */
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2rem, 7vw, 2.8rem);
      color: var(--pine-dk);
      line-height: 1.1;
      margin-bottom: 0.6rem;
    }
    .tagline {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 0.4rem;
    }
    .location {
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sand);
      margin-bottom: 2.5rem;
    }

    /* ── Divider ── */
    .divider {
      width: 60px; height: 2px;
      background: var(--sand);
      margin: 0 auto 2.5rem;
      border-radius: 2px;
    }

    /* ── App badges ── */
    .app-intro {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.25rem;
      color: var(--pine);
      margin-bottom: 1.5rem;
    }
    .badges {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      align-items: center;
    }
    .badges a {
      display: block;
      border-radius: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .badges a:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(28,61,42,0.25);
    }
    .badges img {
      width: 260px;
      max-width: 78vw;
      height: auto;
      display: block;
      border-radius: 14px;
    }

    /* ── Website link ── */
    .site-link {
      margin-top: 2.75rem;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cream);
      background: var(--pine);
      text-decoration: none;
      padding: 0.8rem 1.8rem;
      border-radius: 30px;
      box-shadow: 0 2px 12px rgba(42,92,63,0.28);
      transition: background 0.2s;
    }
    .site-link:hover { background: var(--pine-dk); }

    /* ── Curved pine footer, echoing the site ── */
    .footer-curve {
      width: 100%;
      margin-top: 3rem;
    }
    .footer-curve svg { display: block; width: 100%; height: 60px; }
    footer {
      width: 100%;
      background: var(--pine-dk);
      color: var(--sand-lt);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 1rem 1rem 1.6rem;
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="logo-card">
      <a href="https://gracecommunity.faith">
        <img src="images/logo.png" alt="Grace Community Church" />
      </a>
    </div>

    <h1>Grace Community Church</h1>
    <p class="tagline">Led by the Spirit &ndash; Centered on Christ &ndash; Committed to People</p>
    <p class="location">St. Augustine, Florida</p>

    <div class="divider"></div>

    <p class="app-intro">Get the Grace Community app</p>

    <div class="badges">
      <a href="https://apps.apple.com/app/id6786360721" target="_blank" rel="noopener">
        <img src="images/apple.png" alt="Download on the App Store" />
      </a>
      <a href="https://play.google.com/store/apps/details?id=faith.gracecommunity.app" target="_blank" rel="noopener">
        <img src="images/google.png" alt="Get it on Google Play" />
      </a>
    </div>

    <a class="site-link" href="https://gracecommunity.faith">Visit Our Website</a>
  </div>

  <div class="footer-curve">
    <svg viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,60 C360,0 1080,0 1440,60 L1440,60 L0,60 Z" fill="#1C3D2A"></path>
    </svg>
  </div>
  <footer>
    &copy; 2026 Grace Community Church &nbsp;&bull;&nbsp; St. Augustine, FL
  </footer>

</body>
</html>
